name: skill-proof
version: 1.5.0
description: Local skill discovery, tool gating, truthful load receipts, and invariant compliance verification
kind: standalone
manifest_version: 2
api_version: 1
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - transform_llm_output
  - post_llm_call
  - on_skill_lifecycle
  - on_session_end
config_schema:
  mode:
    type: str
    default: nudge
    description: observe, nudge, or enforce-tools (enforce is an alias)
  reduce_skill_prompt:
    type: bool
    default: false
    description: Replace the full Hermes skills index with the confidently selected skill for the current request
  skill_roots:
    type: list
    default: []
    description: Absolute roots already accessible through Hermes skill_view
  min_score:
    type: float
    default: 0.28
  min_margin:
    type: float
    default: 0.05
  max_candidates:
    type: int
    default: 3
  max_skill_bytes:
    type: int
    default: 262144
  context_budget_bytes:
    type: int
    default: 1200
  observed_tool_limit:
    type: int
    default: 16
  visible_receipt:
    type: bool
    default: true
  receipt_style:
    type: str
    default: compact
    description: compact or verbose footer; trace always contains full evidence
  receipt_history_limit:
    type: int
    default: 20
  invariants:
    type: dict
    default: {}
    description: Skill name to invariant rules (required_tools, forbidden_tools, ordered_tools)
  hub_provenance:
    type: bool
    default: true
    description: Cross-check loaded skills against the local hub lock (read-only)
  hub_lock_path:
    type: str
    default: ""
    description: Override path to skills/.hub/lock.json; empty auto-detects the profile home
  synonyms:
    type: dict
    default: {}
    description: Skill name to extra matching terms (any language), merged with frontmatter aliases
  session_memory:
    type: bool
    default: true
    description: Remember the session's skill history so 'use the same skill' and 'อันที่แล้ว' resolve
  focus_turns:
    type: int
    default: 5
    description: Turns a focused skill stays focused (0 keeps it until released)
  audit_log:
    type: bool
    default: true
    description: Append one derived-numbers JSON line per turn (never prompts or skill bodies)
  audit_path:
    type: str
    default: ""
    description: Override path for the append-only audit log; empty uses plugin-data/skill-proof/audit.jsonl
  audit_limit:
    type: int
    default: 500
    description: Retained audit lines (10-10000); older lines are dropped on rotation
  embedding_provider:
    type: str
    default: off
    description: off, local, or gateway (neutral abstraction; off is zero-config stdlib default)
  embedding_model:
    type: str
    default: Xenova/multilingual-e5-small
    description: Registry model key or HF repo id
  gateway_url:
    type: str
    default: https://api.openai.com/v1/embeddings
    description: OpenAI-compatible embeddings endpoint
  gateway_key_env:
    type: str
    default: OPENAI_API_KEY
    description: Environment variable name holding gateway API key
  models_dir:
    type: str
    default: ""
    description: Directory for local ONNX model downloads (empty defaults to OS-standard models directory)
